<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TiN — Snap Info</title>
<style>
  :root {
    --bg: #0b0f16;
    --fg: #a7b3c2;
    --fg-strong: #dbe4ee;
    --line: rgba(117,220,255,0.12);
    --hover: rgba(117,220,255,0.08);
    --muted: rgba(167,179,194,0.55);
  }
  body[data-theme="light"] {
    --bg: #f5f7fa;
    --fg: #435263;
    --fg-strong: #1d2733;
    --line: rgba(8,127,164,0.14);
    --hover: rgba(8,127,164,0.07);
    --muted: rgba(67,82,99,0.55);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
    font-size: 12px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }
  #titlebar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    -webkit-app-region: drag;   /* frameless 窓のドラッグ移動用 */
    flex-shrink: 0;
  }
  #titlebar svg { width: 14px; height: 14px; flex-shrink: 0; }
  #titlebar .tb-title {
    flex: 1;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-strong);
  }
  .tb-btn {
    -webkit-app-region: no-drag;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 5px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .tb-btn:hover { background: var(--hover); color: var(--fg-strong); }
  .tb-btn.pinned { color: #75dcff; }
  body[data-theme="light"] .tb-btn.pinned { color: #087fa4; }
  .tb-btn svg { width: 13px; height: 13px; }
  #list { flex: 1; overflow-y: auto; padding: 6px; }
  #list::-webkit-scrollbar { width: 5px; }
  #list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .ws-section { margin-bottom: 10px; }
  .ws-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    font-weight: 600;
    color: var(--fg-strong);
  }
  .ws-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ws-grid-size { margin-left: auto; font-size: 10px; color: var(--muted); font-weight: 400; }
  .slot-row {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 6px 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    border-left: 2px solid transparent;
  }
  .slot-row:hover { background: var(--hover); }
  .slot-num {
    font-size: 10px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    min-width: 14px;
    text-align: right;
    flex-shrink: 0;
  }
  .slot-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .slot-label .app { color: var(--fg-strong); }
  .slot-label .detail { color: var(--muted); font-size: 11px; }
  .slot-kind { font-size: 9px; color: var(--muted); flex-shrink: 0; letter-spacing: 0.05em; }
  .empty-note { padding: 16px 10px; text-align: center; color: var(--muted); line-height: 1.7; }
</style>
</head>
<body data-theme="dark">
<div id="titlebar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16v16H4zm6 0v16"/></svg>
  <span class="tb-title">Snap Info</span>
  <button class="tb-btn pinned" id="pin-btn" title="最前面固定を切り替え">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 4h6l1 7 3 3H5l3-3 1-7Zm3 10v6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="tb-btn" id="close-btn" title="閉じる">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m6 6 12 12M18 6 6 18" stroke-linecap="round"/></svg>
  </button>
</div>
<div id="list"></div>

<script>
const { ipcRenderer } = require('electron');
const listEl = document.getElementById('list');
let pinned = true;

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// cwd はフルパスだと長いので末尾ディレクトリ名だけ表示する
function shortPath(p) {
  if (!p) return '';
  const parts = String(p).replace(/[/\\]+$/, '').split(/[/\\]/);
  return parts[parts.length - 1] || p;
}

function render(data) {
  document.body.dataset.theme = data.theme === 'light' ? 'light' : 'dark';
  const sections = [];
  for (const ws of data.workspaces) {
    const accent = ws.color?.accent || 'rgba(117,220,255,0.7)';
    const rows = ws.slots.map(s => {
      const label = s.kind === 'terminal'
        ? `<span class="app">Terminal</span> <span class="detail">${esc(shortPath(s.title))}</span>`
        : `<span class="app">${esc(s.app)}</span> <span class="detail">${esc(s.title)}</span>`;
      return `<div class="slot-row" data-ws="${ws.id}" data-slot="${s.slot}" data-kind="${s.kind}"`
        + ` data-wn="${s.windowNumber ?? ''}" style="border-left-color:${accent}" title="クリックで前面に表示">`
        + `<span class="slot-num">${Number(s.slot) + 1}</span>`
        + `<span class="slot-label">${label}</span>`
        + `<span class="slot-kind">${s.kind === 'terminal' ? 'PTY' : 'SNAP'}</span>`
        + `</div>`;
    }).join('');
    sections.push(`<div class="ws-section">`
      + `<div class="ws-head"><span class="ws-dot" style="background:${accent}"></span>`
      + `${esc(ws.name)}<span class="ws-grid-size">${ws.cols}×${ws.rows}</span></div>`
      + (rows || `<div class="slot-row" style="cursor:default;color:var(--muted)">スナップなし</div>`)
      + `</div>`);
  }
  listEl.innerHTML = sections.join('')
    || `<div class="empty-note">Workspace がありません</div>`;
}

listEl.addEventListener('click', (e) => {
  const row = e.target.closest('.slot-row[data-kind]');
  if (!row) return;
  if (row.dataset.kind === 'terminal') {
    ipcRenderer.invoke('focus-grid-terminal', { slot: Number(row.dataset.slot), wsId: Number(row.dataset.ws) });
  } else if (row.dataset.wn) {
    ipcRenderer.invoke('raise-snapped', { windowNumber: Number(row.dataset.wn) });
  }
});

document.getElementById('close-btn').onclick = () => window.close();
document.getElementById('pin-btn').onclick = async () => {
  pinned = !pinned;
  document.getElementById('pin-btn').classList.toggle('pinned', pinned);
  await ipcRenderer.invoke('snap-info-set-pin', { pinned });
};
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });

async function refresh() {
  try {
    render(await ipcRenderer.invoke('snap-info-data'));
  } catch {}
}
refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
